name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:   # ручной запуск: вкладка Actions → Build APK → Run workflow

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # gradle wrapper в проекте нет, поэтому ставим Gradle напрямую.
      # AGP 8.5.0 требует Gradle 8.7+.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CodeDroid-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
